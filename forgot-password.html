"use strict";
const api=window.B2ME_API;
const el=id=>document.getElementById(id);
const setStatus=(message,ok=false)=>{
 const out=el("message");out.textContent=message;
 out.style.color=ok?"#176d51":"#bf325b";
};
async function init(){
 try{
  const link=await api.consumeEmailLink();
  if(link.type==="recovery"){
    el("intro").textContent="اكتب كلمة مرور جديدة لحسابك في B2ME hub.";
    el("requestForm").hidden=true;el("resetForm").hidden=false;
    return;
  }
  if(link.type==="error")setStatus("رابط الاسترجاع منتهي أو غير صالح. اطلب رابطاً جديداً.");
 }catch(e){setStatus(e?.message||"تعذر التحقق من رابط الاسترجاع.");}
}
el("requestForm").addEventListener("submit",async event=>{
 event.preventDefault();
 const button=el("sendButton");button.disabled=true;setStatus("");
 try{
  await api.sendPasswordReset(el("email").value.trim());
  el("requestForm").hidden=true;
  el("intro").textContent="إذا كان البريد الإلكتروني مسجلاً، راح توصلك رسالة تحتوي رابط الاسترجاع. تأكد من البريد المزعج.";
  setStatus("تم استلام طلبك.",true);
 }catch(e){setStatus(e?.message||"تعذر إرسال رابط الاسترجاع.");}
 finally{button.disabled=false;}
});
el("resetForm").addEventListener("submit",async event=>{
 event.preventDefault();
 const button=el("updateButton");button.disabled=true;setStatus("");
 try{
  const first=el("password").value;
  if(first!==el("confirmPassword").value)throw new Error("كلمتا المرور غير متطابقتين.");
  await api.updatePassword(first);
  try{await api.signOut();}catch(_){}
  el("resetForm").hidden=true;
  el("intro").textContent="تم تحديث كلمة المرور. تگدر تسجّل الدخول هسه بكلمة المرور الجديدة.";
  setStatus("تم تغيير كلمة المرور بنجاح.",true);
 }catch(e){setStatus(e?.message||"تعذر تغيير كلمة المرور.");}
 finally{button.disabled=false;}
});
init();
