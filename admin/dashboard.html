}
function head(title,subtitle){return '<div class="page-heading"><div><p class="eyebrow">B2ME HUB / '+escape(title)+'</p><h1>'+escape(title)+'</h1><p class="page-subtitle">'+escape(subtitle)+'</p></div><button class="primary" data-action="reload">↻ '+(lang==="ar"?"تحديث البيانات":"Refresh data")+'</button></div>'}
function stat(name,value,icon,sub){return '<article class="stat"><div class="stat-header"><span class="stat-title">'+escape(name)+'</span><span class="stat-symbol">'+icon+'</span></div><strong>'+Number(value||0).toLocaleString("en-US")+'</strong><div class="stat-note">'+escape(sub)+'</div></article>'}
function overview(){
 const m=snapshot.metrics||{},data=snapshot.data||{};
 const applications=Number(m.pendingApplications||0)+Number(m.pendingProviders||0)+Number(m.pendingListings||0)+Number(m.pendingOffers||0)+Number(m.pendingVerifications||0);
 const days=[];const now=new Date();for(let n=13;n>=0;n--){const d=new Date(now);d.setDate(now.getDate()-n);days.push(d.toISOString().slice(0,10))}
 const map=Object.fromEntries((snapshot.chart||[]).map(x=>[x.day,Number(x.total)]));const max=Math.max(1,...days.map(x=>map[x]||0));
 const chart=days.map(x=>'<div class="bar-container"><div title="'+x+': '+(map[x]||0)+' applications" class="bar" style="height:'+Math.max(3,Math.round(100*(map[x]||0)/max))+'%"></div><span class="bar-label">'+x.slice(8)+'</span></div>').join("");
 return head(lang==="ar"?"مرحباً بلوحة الإدارة":"Good to have you here","A clear, real-time view of B2ME hub operations.")+
 '<div class="hero"><div class="hero-text"><span class="hero-tag"><span class="live-dot"></span> ONE PLATFORM, COMPLETE CONTROL</span><h2>Everything your business<br>needs in one place.</h2><p>Review providers, manage accounts and keep your marketplace moving.</p><span class="hero-url">◉ admin.b2me-hub.app</span></div><div class="hero-pattern">✳</div></div>'+
 '<div class="stats">'+stat("Total accounts",m.users,"◎","Registered customers & providers")+stat("Service providers",m.providers,"▣",m.approvedProviders+" approved")+stat("Awaiting review",applications,"✦","Across provider & content queues")+stat("New inquiries",m.newInquiries,"✉",m.inquiries+" total inquiries")+'</div>'+
 '<div class="dual"><section class="panel"><div class="panel-head"><div><h3>Provider applications · Last 14 days</h3><span class="muted">Records submitted per day</span></div><button class="text-action" data-go="applications">View all ↗</button></div><div class="chart">'+chart+'</div></section><section class="panel"><div class="panel-head"><h3>Recent moderation</h3><button class="text-action" data-go="audit">Audit log ↗</button></div><div class="activity">'+(data.audit.length?lines(data.audit.slice(0,4)):'<div class="empty">No moderation actions yet</div>')+'</div></section></div>'+
 '<div class="panel"><div class="panel-head"><h3>Review queue</h3><button class="text-action" data-go="applications">Manage requests ↗</button></div><div class="stats" style="margin:0">'+stat("Provider applications",m.pendingApplications,"✦","Awaiting invitation")+stat("Provider profiles",m.pendingProviders,"▣","Awaiting approval")+stat("Products & services",m.pendingListings,"▤","Awaiting publication")+stat("Verifications",m.pendingVerifications,"◉","Awaiting review")+'</div></div>';
}
function actionOptions(key,row){
 if(key==="audit")return [];
 if(key==="accounts")return [{status:"revoke_sessions",label:"Revoke sessions",kind:"danger"}];
 const opts={applications:[["approved","Approve & invite","ok"],["rejected","Reject","danger"]],companies:[["approved","Approve","ok"],["rejected","Reject","danger"],["suspended","Suspend","danger"],["pending","Return to review",""]],listings:[["published","Publish","ok"],["rejected","Reject","danger"],["archived","Archive",""],["pending","Return to review",""]],offers:[["approved","Approve","ok"],["rejected","Reject","danger"],["archived","Archive",""],["pending","Return to review",""]],verification:[["approved","Verify","ok"],["rejected","Reject","danger"]],inquiries:[["read","Mark read",""],["contacted","Contacted","ok"],["closed","Close",""],["new","Reopen",""]],promotions:[["active","Activate","ok"],["paused","Pause",""],["ended","End","danger"],["pending","Return to review",""]],changes:[["approved","Accept changes","ok"],["rejected","Reject changes","danger"]]}[key]||[];
 return opts.filter(x=>x[0]!==row.status && (["applications","verification","changes"].includes(key)?row.status==="pending":true)).map(x=>({status:x[0],label:x[1],kind:x[2]}));
}
function table(){
 const arr=snapshot.data[section]||[];
 const q=search.toLowerCase().trim();
 const filtered=arr.filter(row=>(filter==="all"||String(row.status||"").toLowerCase()===filter)&&(!q||Object.values(row).some(v=>String(v??"").toLowerCase().includes(q))));
 const headings=cols[section]||[];
 const filters=["all","pending","approved","rejected","published","suspended","active","new","read","closed"].filter(x=>x==="all"||arr.some(y=>y.status===x));
 let th=head(t(section),"Live information from your B2ME hub database. Changes are recorded in the audit trail.");
 if(section==="accounts")th+='<div class="notice">Account administration includes reviewing registration information and revoking active sessions. Provider suspension is managed under Providers; email confirmation is never bypassed.</div>';
 if(section==="applications")th+='<div class="notice">Approving an initial application sends a secure invitation. The new provider profile remains pending until separately approved.</div>';
 th+='<div class="section-toolbar"><label class="searchbox">⌕ <input type="search" id="tableSearch" placeholder="'+(lang==="ar"?arabic.search:"Search names, emails and records…")+'" value="'+escape(search)+'"></label><div style="display:flex;align-items:center;gap:10px"><select id="statusFilter" class="select">'+filters.map(k=>'<option value="'+k+'" '+(filter===k?"selected":"")+'>'+k[0].toUpperCase()+k.slice(1)+'</option>').join("")+'</select><span class="record-count">'+filtered.length+" / "+arr.length+" records"+'</span></div></div>';
 th+='<div class="table-panel"><div class="table-scroll"><table class="data-table"><thead><tr>'+headings.map(x=>'<th>'+escape(x[1])+'</th>').join("")+(section!=="audit"?'<th>Status</th><th>Actions</th>':"")+'</tr></thead><tbody>';
 if(!filtered.length)th+='<tr><td colspan="8"><div class="empty"><strong>No records found</strong>Try a different filter or search term.</div></td></tr>';
 else th+=filtered.map(row=>'<tr>'+headings.map(([field])=>'<td><div class="'+(field===headings[0][0]?"item-name":"")+'">'+label(row,field)+'</div>'+(field===headings[0][0]?'<div class="item-sub">'+escape(row.email||row.public_email||row.id||"")+'</div>':"")+'</td>').join("")+(section!=="audit"?'<td>'+badge(row.status|| (row.confirmed?"verified":"unverified"))+'</td><td><div class="row-actions"><button class="btn-mini" data-details="'+escape(row.id)+'">Details</button>'+actionOptions(section,row).slice(0,2).map(x=>'<button class="btn-mini '+escape(x.kind)+'" data-decide="'+escape(row.id)+'" data-status="'+escape(x.status)+'">'+escape(x.label)+'</button>').join("")+'</div></td>':"")+'</tr>').join("");
 th+='</tbody></table></div><div class="table-bottom">Showing up to the 250 most recent records. Last synced: '+escape(new Date(snapshot.updatedAt).toLocaleString())+'</div></div>';
 return th;
}
function render(){
 nav();
 if(!snapshot){$("content").innerHTML='<div class="panel"><div class="skeleton"></div><p>Connecting to B2ME hub…</p></div>';return}
 $("content").innerHTML=section==="overview"?overview():table();
 $("sidebar").classList.remove("open");$("mobileShade").classList.remove("show");
}
async function load(){
 $("refresh").disabled=true;
 try{const response=await fetch("/api/state",{credentials:"same-origin",cache:"no-store"});const data=await response.json();if(!response.ok)throw Error(data.error||"Cannot load dashboard");snapshot=data;render();}
 catch(err){$("content").innerHTML='<div class="panel" style="max-width:560px;margin:35px auto"><h2>Unable to load dashboard</h2><p>'+escape(err.message)+'</p><button class="primary" data-action="reload">Try again</button></div>';notify(err.message,true)}
 finally{$("refresh").disabled=false}
}
function modal(title,body,buttons){$("modalTitle").textContent=title;$("modalBody").innerHTML=body;$("modalButtons").innerHTML=buttons;$("overlay").hidden=false}
function close(){$("overlay").hidden=true}
function details(id){
 const row=(snapshot.data[section]||[]).find(x=>String(x.id)===id);if(!row)return;
 const vals=Object.entries(row).filter(([k])=>!["password_hash"].includes(k)).map(([k,v])=>'<div class="detail-box"><small>'+escape(k.replace(/_/g," "))+'</small><span>'+escape(v&&typeof v==="object"?JSON.stringify(v):v??"—")+'</span></div>').join("");
 const actions=actionOptions(section,row).map(x=>'<button class="'+(x.kind==="danger"?"danger-primary":x.kind==="ok"?"primary":"secondary")+'" data-decide="'+escape(id)+'" data-status="'+escape(x.status)+'">'+escape(x.label)+'</button>').join("");
 modal(row.company_name||row.name_ar||row.full_name||row.email||row.subject||t(section),'<div class="detail">'+vals+'</div>',actions+'<button class="secondary" data-close>Close</button>');
}
function decide(id,status){
 const row=(snapshot.data[section]||[]).find(x=>String(x.id)===id);if(!row)return;
 const item=row.company_name||row.name_ar||row.full_name||row.email||row.subject||row.title_en||row.title_ar||"this record";
 const warning=section==="applications"&&status==="approved"?"An invitation email will be sent. The provider will still require profile approval before appearing publicly.":status==="revoke_sessions"?"The user will be signed out of active sessions. Their account will not be deleted.":"This action will update the live database and be added to the moderation log.";
 modal("Confirm "+status.replace(/_/g," "),'<p style="font-size:13px;color:#5e667e;line-height:1.9">Apply <strong>'+escape(status)+'</strong> to <strong>'+escape(item)+'</strong>?</p><div class="notice">'+escape(warning)+'</div>','<button class="secondary" data-close>Cancel</button><button class="primary" id="commit" data-commit="'+escape(id)+'" data-status="'+escape(status)+'">Confirm action</button>');
}
async function commit(id,status){
 if(busy)return;busy=true;
 const el=$("commit");if(el){el.disabled=true;el.textContent="Saving…";}
 try{const r=await fetch("/api/action",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({entity:sources[section]||section,id,status})});const data=await r.json();if(!r.ok)throw Error(data.error||"Could not save");close();notify(data.invited?"Approved. Invitation sent; provider profile awaits final approval.":"Decision saved to B2ME hub.");await load();}
 catch(err){notify(err.message,true);if(el){el.disabled=false;el.textContent="Confirm action";}}
 finally{busy=false}
}
document.addEventListener("click",event=>{
 const go=event.target.closest("[data-go]");if(go){section=go.dataset.go;search="";filter="all";render();return}
 if(event.target.closest("[data-action=reload]")||event.target.closest("#refresh")){load();return}
 const d=event.target.closest("[data-details]");if(d){details(d.dataset.details);return}
 const a=event.target.closest("[data-decide]");if(a){decide(a.dataset.decide,a.dataset.status);return}
 const c=event.target.closest("[data-commit]");if(c){commit(c.dataset.commit,c.dataset.status);return}
 if(event.target.closest("[data-close],#modalClose")||event.target.id==="overlay")close();
});
document.addEventListener("input",e=>{if(e.target.id==="tableSearch"){const pos=e.target.selectionStart;search=e.target.value;render();const s=$("tableSearch");if(s){s.focus();s.setSelectionRange(pos,pos);}}});
document.addEventListener("change",e=>{if(e.target.id==="statusFilter"){filter=e.target.value;render()}});
$("menuToggle").onclick=()=>{$("sidebar").classList.toggle("open");$("mobileShade").classList.toggle("show")};
$("mobileShade").onclick=()=>{$("sidebar").classList.remove("open");$("mobileShade").classList.remove("show")};
$("langBtn").onclick=()=>{lang=lang==="en"?"ar":"en";document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";$("langBtn").textContent=lang==="en"?"عربي":"English";document.querySelectorAll("[data-i]").forEach(n=>n.textContent=t(n.dataset.i));render()};
$("refresh").onclick=load;
$("modalClose").onclick=close;
document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
load();
})();
</script></body></html>
