name: B2ME Supabase database activity

on:
  schedule:
    - cron: '17 3,11,19 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/b2me-supabase-activity.yml'

permissions:
  contents: read

concurrency:
  group: b2me-supabase-database-activity
  cancel-in-progress: false

jobs:
  read-only-database-check:
    name: Small authenticated database read
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SUPABASE_URL: 'https://wlamwvhrcezhpbudfzhp.supabase.co'
      SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_BZwoD19dvThmSawDRSutIA_arliTbQU'
    steps:
      - name: Query B2ME public categories without writing any data
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --fail-with-body --retry 2 --retry-delay 5 --connect-timeout 10 --max-time 25 \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "accept: application/json" \
            -o /tmp/b2me-health.json \
            -w '%{http_code}' \
            "${SUPABASE_URL}/rest/v1/categories?select=id&limit=1")"
          echo "Read-only categories query: HTTP ${code}"
          python3 - <<'PY'
          import json
          with open('/tmp/b2me-health.json', encoding='utf-8') as f:
              rows = json.load(f)
          if not isinstance(rows, list):
              raise SystemExit("Unexpected Supabase response: expected an array")
          print("Database query succeeded (no records inserted or modified).")
          PY
