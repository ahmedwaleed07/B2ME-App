function submitAuth(e){e.preventDefault();const email=el('emailAuth').value.trim(),pass=el('passwordAuth').value;if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)||pass.length<6){el('authError').textContent=t('authError');return}if(authMode==='signup'&&pass!==el('passwordAgain').value){el('authError').textContent=t('authConfirm');return}const user={email};if(el('remember').checked)localStorage.setItem('b2me_session',JSON.stringify(user));else localStorage.removeItem('b2me_session');sessionStorage.setItem('b2me_email',email);go('choice')}
function renderChoice(){el('choice').innerHTML=`<div class="choiceWrap"><img class="choiceIcon" src="${B2ME_ICON}" alt="B2ME approved logo"><h2>${t('hello')}</h2><button class="cta" onclick="go('home')">${t('explore')} ${uiIcon('arrow')}</button><button class="textLink" onclick="go('provider_join')">${t('offerHelp')}</button><p class="choiceHint">${t('offerHint')}</p></div>`}
function catCard(cat){return `<button class="category" onclick="chooseCategory('${cat.id}')"><span class="categoryIcon" style="background:${cat.bg};color:${cat.color}">${uiIcon(cat.icon)}</span><span>${esc(cname(cat))}</span></button>`}
function companyLogo(c){return c.dashboardLogo?`<img src="${c.dashboardLogo}" alt="Company logo">`:c.logo==='asas'?`<img src="${ASAS_LOGO}" alt="ASAS 360° original logo">`:esc(c.logo)}
function companyCard(c){return `<article class="companyCard"><div class="cover ${c.cover||''}"></div><button class="favoriteBtn ${favorites.includes(c.id)?'on':''}" onclick="toggleFavorite('${c.id}')" aria-label="${t('favAdd')}">${uiIcon('heart')}</button><div class="companyCardBody"><div class="companyLogo">${companyLogo(c)}</div><div class="bizTitle">${esc(cname(c))}</div><div class="bizField">${esc(catName(c.sector))}</div><div class="bizBottom"><span>${uiIcon('pin').replace('svgico','svgico').replace('class="svgico"','class="svgico" style="width:12px;height:12px;vertical-align:middle"')} ${esc(language==='ar'?c.cityAr:c.cityEn)}</span><button class="miniBtn" onclick="openCompany('${c.id}')">${t('view')}</button></div></div></article>`}
function header(){return `<div class="headArea"><div class="headLine"><div class="tinyBrand"><img src="${B2ME_ICON}" alt="B2ME"><div><small>العراق · Iraq</small></div></div><button class="iconButton" onclick="openNotifications()" aria-label="${t('notifications')}">${uiIcon('bell')}<span class="dot"></span></button></div><h2>${t('discover')}</h2><div class="searchbar">${uiIcon('search')}<input type="search" id="quickSearch" placeholder="${t('search')}" oninput="searchNow(this.value)" onkeydown="if(event.key==='Enter'){event.preventDefault();searchNow(this.value)}" value="${esc(searchTerm)}"/></div></div>`}
function offerCard(o){return `<button class="offerCard" onclick="openCompany('${o.cid}')"><div class="offerVisual">${o.cid==='asas'?'ASAS 360°':'B2ME'}</div><span class="offerMark">${t('sponsored')}</span><div class="offerTxt"><strong>${esc(o[language])}</strong><small>${esc(o[language==='ar'?'brandAr':'brandEn'])}</small></div></button>`}
function sectionRow(title,click){return `<div class="sectionRow"><h3>${title}</h3>${click?`<button onclick="${click}">${t('seeAll')}</button>`:''}</div>`}
function renderHome(){const rec=companies.filter(c=>c.recent),you=interests.length?companies.filter(c=>interests.includes(c.sector)):companies.slice(1,3);el('home').innerHTML=header()+sectionRow(t('categories'),"go('categories')")+`<div class="catGrid">${categoriesData.slice(0,6).map(catCard).join('')}</div>`+sectionRow(t('specialOffers'),null)+`<div class="horizontalOffers">${offers.map(offerCard).join('')}</div>`+sectionRow(t('recent'),"go('listings')")+`<div class="companyGrid">${rec.slice(0,2).map(companyCard).join('')}</div>`+sectionRow(t('forYou'),"go('listings')")+`<div class="companyGrid">${you.slice(0,2).map(companyCard).join('')}</div><p class="loadingNotice">${t('guestNote')}</p>`}
function renderCategories(){el('categories').innerHTML=topbar(t('categories'))+`<p class="pageIntro">${t('explore')}</p><div class="catGrid">${categoriesData.map(catCard).join('')}</div>`}
function chooseCategory(id){filter=id;interests=[id,...interests.filter(x=>x!==id)].slice(0,4);localStorage.setItem('b2me_interests',JSON.stringify(interests));go('listings')}
function renderListings(){const arr=companies.filter(c=>(filter==='all'||c.sector===filter)&&[cname(c),catName(c.sector),c[language==='ar'?'bioAr':'bioEn']].join(' ').toLowerCase().includes(searchTerm.toLowerCase()));el('listings').innerHTML=topbar(t('discover'),'home')+`<div class="pageIntro">${t('search')}</div><div class="searchbar" style="margin:10px 17px;box-shadow:0 2px 16px #0000000a">${uiIcon('search')}<input type="search" placeholder="${t('search')}" value="${esc(searchTerm)}" oninput="searchNow(this.value)"/></div><div class="filterRow"><button class="filterChip ${filter==='all'?'on':''}" onclick="filter='all';renderListings()">${language==='ar'?'الكل':'All'}</button>${categoriesData.map(c=>`<button class="filterChip ${filter===c.id?'on':''}" onclick="filter='${c.id}';renderListings()">${esc(cname(c))}</button>`).join('')}</div>${arr.length?`<div class="companyGrid">${arr.map(companyCard).join('')}</div>`:`<div class="empty">${t('noResults')}</div>`}<p class="loadingNotice">${t('guestNote')}</p>`}
function searchNow(value){searchTerm=value;filter='all';if(screen!=='listings'){go('listings');return}const active=document.activeElement;const pos=active&&active.selectionStart;renderListings();const inp=el('listings').querySelector('input');if(inp){inp.focus();if(pos!=null)try{inp.setSelectionRange(pos,pos)}catch(_){}}}
function toggleFavorite(id){favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];localStorage.setItem('b2me_favorites',JSON.stringify(favorites));render()}
function openCompany(id){selectedCompany=id;const c=companies.find(x=>x.id===id);interests=[c.sector,...interests.filter(x=>x!==c.sector)].slice(0,4);localStorage.setItem('b2me_interests',JSON.stringify(interests));go('profile')}
function infoRow(icon,label,value,isLink=false){return `<div class="infoRow">${uiIcon(icon)}<div><strong style="display:block;color:#67728b;margin-bottom:3px">${label}</strong>${isLink?`<a href="${esc(value)}" target="_blank" rel="noopener noreferrer">${esc(value)}</a>`:esc(value)}</div></div>`}
function renderProfile(){const c=companies.find(x=>x.id===selectedCompany)||companies[0];el('profile').innerHTML=topbar(t('company'),'listings')+`<div class="pageBody"><div class="profileCover ${c.cover||''}"></div><div class="profileSummary"><div class="companyLogo">${companyLogo(c)}</div><h2>${esc(cname(c))}</h2><span class="smallPill">${esc(catName(c.sector))}</span><p>${esc(c[language==='ar'?'bioAr':'bioEn'])}</p><div class="inlineBadges">${c[language==='ar'?'servicesAr':'servicesEn'].map(x=>`<span>${esc(x)}</span>`).join('')}</div></div><div class="infoCard"><h3>${t('contact')}</h3>${infoRow('mail',t('email'),c.email)}${infoRow('phone',t('phone'),c.phone)}${infoRow('globe',t('website'),c.site,true)}${infoRow('external',t('social'),c.social,true)}</div><p class="subtle">${t('guestNote')}</p><button class="cta" onclick="go('request')">${t('connect')} ${uiIcon('arrow')}</button></div>`}
function renderRequest(){const c=companies.find(x=>x.id===selectedCompany)||companies[0];el('request').innerHTML=topbar(t('serviceTitle'),'profile',cname(c))+`<div class="pageBody"><div class="formNotice">${t('connect')} — ${esc(cname(c))}. ${t('demoStatus')}</div><form class="formCard" onsubmit="submitRequest(event)">${fieldInput('rqName',t('personName'),'text',true)}${fieldInput('rqEmail',t('email'),'email',true,sessionStorage.getItem('b2me_email')||'')}${fieldInput('rqPhone',t('phone'),'tel',true)}<div class="field"><label for="rqCompany">${t('companyName')}</label><input id="rqCompany" type="text"></div><div class="field"><label for="rqDesc">${t('describe')} *</label><textarea id="rqDesc" required minlength="6"></textarea></div><button class="cta" type="submit">${t('submitDemo')}</button></form><p class="subtle">${t('requestDone')}</p></div>`}
function fieldInput(id,label,type,required=false,value=''){return `<div class="field"><label for="${id}">${label}${required?' *':''}</label><input id="${id}" type="${type}" ${required?'required':''} value="${esc(value)}"></div>`}
function submitRequest(e){e.preventDefault();const data={provider:selectedCompany,name:el('rqName').value,email:el('rqEmail').value,phone:el('rqPhone').value,company:el('rqCompany').value,message:el('rqDesc').value,time:Date.now()};localStorage.setItem('b2me_demo_request',JSON.stringify(data));toast(t('requestDone'));go('profile')}
function renderFavorites(){const arr=companies.filter(x=>favorites.includes(x.id));el('favorites').innerHTML=topbar(t('favorites'))+(arr.length?`<div class="companyGrid" style="padding-top:16px">${arr.map(companyCard).join('')}</div>`:`<div class="empty">${t('noFavorites')}</div>`)}
function previewTone(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C){toast(t('notificationNote'));return}const ac=new C();const now=ac.currentTime;[{f:740,t:0},{f:990,t:.17},{f:1480,t:.32}].forEach(n=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(n.f,now+n.t);g.gain.setValueAtTime(.0001,now+n.t);g.gain.exponentialRampToValueAtTime(.08,now+n.t+.025);g.gain.exponentialRampToValueAtTime(.0001,now+n.t+.22);o.connect(g);g.connect(ac.destination);o.start(now+n.t);o.stop(now+n.t+.23)});setTimeout(()=>ac.close(),1000)}catch(e){toast(t('notificationNote'))}}
function openNotifications(){previewTone();go('notifications')}
function renderNotifications(){el('notifications').innerHTML=topbar(t('notifications'))+`<div class="pageBody"><p class="formNotice">${t('notificationNote')}</p><div class="notificationItem"><div class="notiDot"></div><div><strong>${t('specialOffers')}</strong><p>${language==='ar'?'عروض الشركات المدفوعة تظهر هنا بعد الاشتراك والموافقة.':'Paid and approved provider offers appear here.'}</p></div></div><div class="notificationItem"><div class="notiDot" style="background:#465ff3"></div><div><strong>${t('recent')}</strong><p>${language==='ar'?'أضيفت خدمات جديدة من المجهزين.':'New provider services have been added.'}</p></div></div><button class="cta" onclick="previewTone()">${t('playSound')}</button></div>`}
function renderProviderJoin(){el('provider_join').innerHTML=topbar(t('onboarding'),'choice')+`<div class="pageBody"><div class="formNotice">${t('joinExplain')}</div><form class="formCard" onsubmit="submitProviderJoin(event)">${fieldInput('pvName',t('personName'),'text',true)}${fieldInput('pvEmail',t('email'),'email',true,sessionStorage.getItem('b2me_email')||'')}${fieldInput('pvPhone',t('phone'),'tel',true)}<label class="remember" style="color:#525c73;margin-bottom:14px"><input id="pvFreelance" type="checkbox" onchange="el('pvCompany').required=!this.checked"> ${t('freelancer')}</label>${fieldInput('pvCompany',t('businessName'),'text',true)}<button type="submit" class="cta">${t('joinSubmit')}</button></form><p class="subtle">${t('demoStatus')}</p></div>`}
function submitProviderJoin(e){e.preventDefault();localStorage.setItem('b2me_demo_provider_application',JSON.stringify({name:el('pvName').value,email:el('pvEmail').value,phone:el('pvPhone').value,isFreelancer:el('pvFreelance').checked,company:el('pvCompany').value,date:Date.now()}));toast(t('joinDone'));go('choice')}
function renderTabs(){const shown=['home','categories','listings','profile','request','favorites','notifications'].includes(screen);el('tabs').classList.toggle('show',shown);el('tabs').innerHTML=[['home','home','home'],['categories','categories','grid'],['favorites','favorites','heart'],['choice','account','user']].map(([id,txt,icon])=>`<button class="tab ${screen===id?'active':''}" onclick="go('${id}')">${uiIcon(icon)}<span>${t(txt)}</span></button>`).join('')}
function syncDashboardDemo(){try{const d=JSON.parse(localStorage.getItem('b2me_provider_dashboard')||'null');if(!d)return;const c=companies[0];if(d.name){c.ar=d.name;c.en=d.name}if(d.email)c.email=d.email;if(d.phone)c.phone=d.phone;if(d.website)c.site=d.website;if(d.facebook||d.instagram||d.linkedin)c.social=d.facebook||d.instagram||d.linkedin;if(d.desc){c.bioAr=d.desc;c.bioEn=d.desc}if(d.cat&&categoriesData.some(x=>x.id===d.cat))c.sector=d.cat;if(d.logo)c.dashboardLogo=d.logo;if(d.cover)c.dashboardCover=d.cover; if(Array.isArray(d.services)){c.servicesAr=d.services;c.servicesEn=d.services}if(Array.isArray(d.offers)){offers.splice(0,offers.length,...d.offers.filter(x=>x.enabled).map(x=>({cid:'asas',ar:x.title,en:x.title,brandAr:c.ar,brandEn:c.en})),{cid:'bright',ar:'باقة تصوير المنتجات',en:'Product Photography Package',brandAr:'ستوديو بيكسل (تجريبي)',brandEn:'Pixel Studio (Demo)'})}}catch(e){}}function render(){syncDashboardDemo();document.documentElement.lang=language;document.documentElement.dir=language==='ar'?'rtl':'ltr';el('la').classList.toggle('sel',language==='ar');el('le').classList.toggle('sel',language==='en');for(const x of document.querySelectorAll('.screen'))x.classList.toggle('active',x.id===screen);renderAuth();renderChoice();renderHome();renderCategories();renderListings();renderProfile();renderRequest();renderFavorites();renderNotifications();renderProviderJoin();renderTabs();el('demoSubtitle').textContent=t('demoStatus');}
try{const s=JSON.parse(localStorage.getItem('b2me_session')||'null');if(s?.email){sessionStorage.setItem('b2me_email',s.email);screen='choice'}}catch(e){}render();document.body.classList.add('js-ready');
</script><script src="./b2me-api.js"></script><script src="./b2me-app-live.js"></script></body></html>
